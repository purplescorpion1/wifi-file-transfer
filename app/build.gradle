plugins {
    id 'com.android.application'
}

android {
    namespace 'com.wifi.filetransfer'
    compileSdk 30

    defaultConfig {
        applicationId "com.wifi.filetransfer"
        minSdk 8
        targetSdk 17
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    // Zero external dependencies! Keeps the app incredibly lightweight,
    // ultra-compatible (from API 8 to 35+), and builds in seconds.
    testImplementation 'junit:junit:4.13.2'
}
